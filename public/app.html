<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070708">
<title>THRILLHUNT</title>
<link rel="stylesheet" href="/css/theme.css">
</head>
<body>
<header class="topbar">
  <div class="inner">
    <a class="brand" href="#/home" style="color:inherit">THRILL<em>HUNT</em></a>
    <div class="grow"></div>
    <button class="iconbtn" style="width:38px;height:38px;font-size:.95rem" aria-label="Notifications" onclick="location.hash='#/notifications'">🔔</button>
    <button class="iconbtn" style="width:38px;height:38px;font-size:.95rem" aria-label="Messages" onclick="location.hash='#/chats'">💬</button>
  </div>
</header>

<main class="shell" id="view" aria-live="polite"></main>

<nav class="tabbar" id="tabbar" aria-label="Primary">
  <div class="inner">
    <button data-tab="home"><span class="ico" aria-hidden="true">🏠</span>Home</button>
    <button data-tab="explore"><span class="ico" aria-hidden="true">🧭</span>Explore</button>
    <button data-tab="map"><span class="ico" aria-hidden="true">🗺️</span>Map</button>
    <button data-tab="groups"><span class="ico" aria-hidden="true">👥</span>Groups</button>
    <button data-tab="profile"><span class="ico" aria-hidden="true">🎯</span>Profile</button>
  </div>
</nav>

<!--
  Real map tiles (roads + terrain), via Leaflet + OpenStreetMap/OpenTopoMap.
  This is deliberately NOT the Google Maps JS API: that requires a paid API
  key tied to a billing account, which this build does not have and will not
  fabricate. Leaflet + OSM needs no key and is fully pannable/zoomable across
  the whole US (and beyond). Swapping in Google's tiles later is a tile-layer
  URL change in nav-service.js's sibling, js/leaflet-map.js — see MAPS_PROVIDER
  in src/config.ts.
-->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module" src="/js/app.js"></script>
</body>
</html>
